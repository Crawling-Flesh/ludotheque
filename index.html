/* ── TOAST ── */
function showToast(msg,type='success'){
  const c=document.getElementById('toast-container');
  if(!c)return;
  const col=type==='success'?'#00c9a7':type==='error'?'#ff5470':'#e8b84b';
  const t=document.createElement('div');
  t.style.cssText=`background:#121a2e;border:1px solid ${col}55;border-left:3px solid ${col};border-radius:8px;padding:10px 16px;font-size:12px;font-weight:700;color:${col};font-family:Nunito,sans-serif;animation:toastIn .25s ease;pointer-events:none;max-width:300px;`;
  t.textContent=(type==='success'?'✓ ':type==='error'?'✗ ':'ℹ ')+msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.animation='toastOut .3s ease forwards';setTimeout(()=>t.remove(),300);},2500);
}

function matchGames(player,games){
  const hL=player.langue.length>0,hT=player.types.length>0;
  const hI=player.interactions.length>0,hP=player.tempsPref.length>0,hH=player.themes.length>0;
  return games.map(g=>{
    let s=0,m=0;
    if(hL){m++;if(player.langue.some(l=>g.langue.includes(l)))s++;}
    if(hT){m++;if(player.types.some(t=>g.types.includes(t)))s++;}
    if(hI&&g.interaction){m++;if(player.interactions.includes(g.interaction))s++;}
    if(hP){m++;const ok=player.tempsPref.some(p=>p.includes('≤60')?g.temps<=60:p.includes('60-120')?g.temps>60&&g.temps<=120:g.temps>120);if(ok)s++;}
    if(hH){m++;if(player.themes.includes(g.theme))s++;}
    return{...g,score:s,max:m,pct:m>0?Math.round(s/m*100):100};
  }).sort((a,b)=>b.pct-a.pct);
}

/* ── EXPORT / IMPORT JSON ── */
function exportJSON(games,players){
  const data={version:1,exported:new Date().toISOString(),games,players};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`ludotheque_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast('Sauvegarde JSON téléchargée !');
}
function importJSON(callback){
  const fi=document.getElementById('file-input');
  fi.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.games||!data.players)throw new Error('Format invalide');
        callback(data.games,data.players);
      }catch(err){showToast('Fichier invalide : '+err.message,'error');}
      fi.value='';
    };
    reader.readAsText(file);
  };fi.click();
}

/* ── APP ── */
function App(){
  const [games, setGames] = useState([]);
  const [players, setPlayers] = useState([]);
  const [page, setPage] = useState('collection');
  const [loading, setLoading] = useState(true);

  // Charger les données depuis Supabase
  const fetchData = async () => {
    setLoading(true);
    try {
      const { data: gData } = await supabaseClient.from('games').select('*');
      const { data: pData } = await supabaseClient.from('players').select('*');
      
      if (gData) setGames(gData);
      if (pData) setPlayers(pData);
    } catch (err) {
      console.error("Erreur critique de communication BDD", err);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchData();
  }, []);

  /* ── ACTIONS JEUX (BDD) ── */
  const saveGame = async (f) => {
    const isNew = !f.id;
    const nextId = isNew ? (games.length > 0 ? Math.max(...games.map(g => g.id)) + 1 : 1) : f.id;
    const finalGame = { ...f, id: nextId };
    
    const { error } = await supabaseClient.from('games').upsert(finalGame);
    if (!error) {
      setGames(isNew ? [...games, finalGame] : games.map(g => g.id === f.id ? finalGame : g));
      showToast(isNew ? 'Jeu ajouté à la table !' : 'Fiche jeu modifiée !');
    } else {
      showToast('Erreur Supabase : ' + error.message, 'error');
    }
  };

  const deleteGame = async (id) => {
    if (!confirm('Supprimer ce jeu de la ludothèque ?')) return;
    const { error } = await supabaseClient.from('games').delete().eq('id', id);
    if (!error) {
      setGames(games.filter(g => g.id !== id));
      showToast('Jeu supprimé.');
    } else {
      showToast('Erreur de suppression : ' + error.message, 'error');
    }
  };

  /* ── ACTIONS JOUEURS (BDD) ── */
  const savePlayer = async (f) => {
    const isNew = !f.id;
    const nextId = isNew ? (players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1) : f.id;
    const finalPlayer = { ...f, id: nextId };
    
    const { error } = await supabaseClient.from('players').upsert(finalPlayer);
    if (!error) {
      setPlayers(isNew ? [...players, finalPlayer] : players.map(p => p.id === f.id ? finalPlayer : p));
      showToast(isNew ? 'Nouveau joueur enregistré !' : 'Fiche joueur mise à jour !');
    } else {
      showToast('Erreur Supabase : ' + error.message, 'error');
    }
  };

  const deletePlayer = async (id) => {
    if (!confirm('Supprimer ce compagnon de jeu ?')) return;
    const { error } = await supabaseClient.from('players').delete().eq('id', id);
    if (!error) {
      setPlayers(players.filter(p => p.id !== id));
      showToast('Compagnon effacé.');
    } else {
      showToast('Erreur de suppression : ' + error.message, 'error');
    }
  };

  /* ── BACKUPS & SYNCHRONISATION ── */
  const handleImport = async (g, p) => {
    setLoading(true);
    const { error: gErr } = await supabaseClient.from('games').upsert(g);
    const { error: pErr } = await supabaseClient.from('players').upsert(p);
    if (!gErr && !pErr) {
      setGames(g); setPlayers(p);
      showToast('Restauration complète effectuée dans le Cloud !');
    } else {
      showToast('Erreur d\'injection dans les tables.', 'error');
    }
    setLoading(false);
  };

  const handleExport = () => exportJSON(games, players);
  
  const handleRefresh = async () => {
    await fetchData();
    showToast('Ludothèque synchronisée depuis le Cloud !', 'success');
  };

  if (loading) return React.createElement('div', {style: {color: AU, textAlign: 'center', paddingTop: '100px', fontFamily: 'Cinzel, serif', fontSize: '18px'}}, React.createElement('div', {className: 'spinner', style: {marginRight: '10px'}}), 'Invocation de la ludothèque céleste...');

  const nav=[
    {id:'collection',label:'Collection',icon:'🎲',count:games.length,col:AU,rgb:'232,184,75'},
    {id:'joueurs',label:'Joueurs·euses',icon:'👥',count:players.length,col:VI,rgb:'155,114,245'},
    {id:'recherche',label:'Recherche',icon:'🔍',count:null,col:TE,rgb:'0,201,167'},
  ];

  return React.createElement('div',{style:{minHeight:'100vh',background:BG,color:'#e2ddd5',fontFamily:'Nunito,sans-serif'}},
    React.createElement('div',{style:{background:SU,borderBottom:`1px solid ${BO}`,padding:'10px 20px',display:'flex',alignItems:'center',gap:8,position:'sticky',top:0,zIndex:100,backdropFilter:'blur(8px)',flexWrap:'wrap'}},
      React.createElement('div',{style:{fontFamily:'Cinzel,serif',fontWeight:900,fontSize:16,color:AU,letterSpacing:'.04em',marginRight:8,whiteSpace:'nowrap'}},'🎲 Ludothèque'),
      React.createElement('div',{style:{display:'flex',gap:5,flex:1,flexWrap:'wrap'}},
        nav.map(n=>{
          const sel=page===n.id;
          return React.createElement('button',{key:n.id,onClick:()=>setPage(n.id),style:{background:sel?`rgba(${n.rgb},.13)`:'transparent',color:sel?n.col:DIM,border:`1px solid ${sel?`rgba(${n.rgb},.35)`:'rgba(122,122,154,.15)'}`,borderRadius:8,padding:'6px 13px',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s',display:'flex',alignItems:'center',gap:5,fontFamily:'Nunito,sans-serif'}},
            n.icon,' ',n.label,
            n.count!==null&&React.createElement('span',{style:{background:'rgba(255,255,255,.07)',borderRadius:999,padding:'1px 7px',fontSize:10}},n.count)

      React.createElement('div',{style:{display:'flex',gap:5,alignItems:'center',flexWrap:'wrap'}},
        React.createElement('button',{onClick:handleExport,title:'Exporter en JSON (sauvegarde externe)',style:{background:'rgba(0,201,167,.1)',color:TE,border:'1px solid rgba(0,201,167,.3)',borderRadius:8,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}},'💾 Exporter'),
        React.createElement('button',{onClick:()=>importJSON(handleImport),title:'Importer et écraser la base Cloud',style:{background:'rgba(155,114,245,.1)',color:VI,border:'1px solid rgba(155,114,245,.3)',borderRadius:8,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}},'📂 Importer'),
        React.createElement('button',{onClick:handleRefresh,title:'Synchroniser avec le Cloud',style:{background:'rgba(96,165,250,.1)',color:'#60a5fa',border:'1px solid rgba(96,165,250,.3)',borderRadius:8,padding:'5px 10px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'Nunito,sans-serif'}},'↻ Actualiser')
      )
    ),
    React.createElement('div',{style:{maxWidth:1300,margin:'0 auto',padding:'22px 20px'}},
      page==='collection'&&React.createElement(CollectionPage,{games,onSave:saveGame,onDelete:deleteGame}),
      page==='joueurs'&&React.createElement(JoueursPage,{players,games,onSave:savePlayer,onDelete:deletePlayer}),
      page==='recherche'&&React.createElement(RecherchePage,{games})
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>

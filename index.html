<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070a12;color:#e2ddd5;font-family:'Nunito',sans-serif;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#070a12}
::-webkit-scrollbar-thumb{background:#1c2240;border-radius:3px}
select option{background:#111827;color:#e2ddd5}
@keyframes slideIn{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(20px)}}
.panel-anim{animation:slideIn .22s ease}
.fade-up{animation:fadeUp .18s ease}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(232,184,75,.3);border-top-color:#e8b84b;border-radius:50%;animation:spin .7s linear infinite}
.tooltip-wrap{position:relative;display:inline-block}
.tooltip-wrap .tooltip-box{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#1a2035;border:1px solid rgba(232,184,75,.3);border-radius:8px;padding:10px 13px;width:280px;font-size:11px;color:#c8c0b0;line-height:1.6;z-index:9999;pointer-events:none;opacity:0;transition:opacity .15s;white-space:normal}
.tooltip-wrap:hover .tooltip-box{opacity:1}
.ext-tooltip{position:absolute;top:calc(100% + 6px);left:0;background:#1a2035;border:1px solid rgba(0,201,167,.3);border-radius:8px;padding:8px 12px;min-width:160px;font-size:11px;color:#c8c0b0;z-index:9999;white-space:nowrap;pointer-events:none}
input[type=range]{accent-color:#e8b84b}
</style>
</head>

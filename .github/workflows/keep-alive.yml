    # S'exécute automatiquement TOUS LES JOURS à 10h00 UTC
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (écriture dans keepalive)
        run: |
          curl --fail-with-body -sS -X POST "https://vjeomepcepthulzygqfv.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_KOVZ0CGTGVaBJjGoKBdmpw_dQx0W6ZY" \
            -H "Content-Type: application/json" \
            -d '{}'
